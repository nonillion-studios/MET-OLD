name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build Electron app (Windows installer)
        run: npm run electron:build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaAI-Studio-Windows
          path: release/*.exe
          if-no-files-found: error
