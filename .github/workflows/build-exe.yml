name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove optional native ws accelerators (no VS toolchain on this runner)
        # bufferutil/utf-8-validate are optional perf addons for 'ws' (pulled in
        # transitively via @google/genai), not needed by this app - ws works fine
        # without them. electron-builder's npmRebuild:false doesn't stop it from
        # trying to rebuild them via node-gyp, which fails without Visual Studio,
        # so just remove them before packaging. Removing the whole .npmrc/optional
        # deps globally instead broke other builds (e.g. Rollup's platform-specific
        # native binary), so this is done surgically, here only.
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force node_modules\bufferutil -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force node_modules\utf-8-validate -ErrorAction SilentlyContinue

      - name: Typecheck
        run: npm run lint

      - name: Build Electron app (Windows installer)
        run: npm run electron:build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaAI-Studio-Windows
          path: release/*.exe
          if-no-files-found: error
